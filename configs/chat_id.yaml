agent_name: chat-id-agent

# Indonesian free-chat assistant over the Qwen3 SageMaker backends (OmniVoice TTS).
# Deploy the endpoints first (sagemaker/deploy_qwen.py and sagemaker/deploy.py).

preemptive_generation: true

llm:
  model: openai.gpt-oss-120b-1:0
  region: us-west-2
  reasoning_effort: low
  persistent_connection: true
  prewarm: true

tts:
  backend: omnivoice_sagemaker
  endpoint_name: omnivoice-tts
  region: us-west-2
  language: Indonesian
  num_step: 16

stt:
  backend: qwen_sagemaker
  endpoint_name: qwen3-asr
  region: us-west-2
  language: id

vad:
  activation_threshold: 0.55
  min_speech_duration: 0.08
  min_silence_duration: 0.55

prompt:
  persona: |
    Anda adalah asisten suara berbahasa Indonesia.
    Selalu jawab dalam bahasa Indonesia, sopan dan ringkas, satu hingga tiga kalimat.
  voice_rules: |
    Anda berkomunikasi melalui suara. Ikuti aturan berikut:
    - Jawab hanya dalam teks biasa, tanpa JSON, markdown, daftar, tabel, atau emoji.
    - Ucapkan angka secara alami dalam bahasa Indonesia.
